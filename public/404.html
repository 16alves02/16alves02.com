<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f7f3ec">
  <title>Page not found | 16alves02</title>
  <style>
    :root { color-scheme: light; --paper: #f7f3ec; --ink: #211f1b; --orange: #eb4520; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 740px); border: 2px solid var(--ink); padding: clamp(28px, 7vw, 64px); box-shadow: 9px 9px 0 var(--ink); }
    .eyebrow { font: 12px monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 22px 0 12px; font-size: clamp(3.8rem, 15vw, 8rem); line-height: .85; letter-spacing: -.08em; }
    h1 span { color: var(--orange); }
    p { max-width: 42ch; line-height: 1.7; color: #5e574f; }
    a { display: inline-flex; margin-top: 18px; padding: 13px 18px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
    a:hover { background: var(--orange); color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">16ALVES02 / 404</div>
    <h1>Page not <span>found.</span></h1>
    <p>The page may have moved or the address may be incorrect. Head back to the portfolio to explore the projects and background.</p>
    <a href="/">Back to the portfolio ↗</a>
  </main>
</body>
</html>
