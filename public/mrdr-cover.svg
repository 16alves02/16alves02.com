  </g>
  <text x="90" y="250" fill="#f0ece6" font-family="Arial Narrow, Impact, sans-serif" font-size="126" font-weight="900" letter-spacing="5">MRDR<tspan fill="#b52d25">.</tspan></text>
  <text x="96" y="302" fill="#d3ad5b" font-family="monospace" font-size="18" font-weight="700" letter-spacing="5">CRIME &amp; DEDUCTION UNIT</text>
  <text x="96" y="368" fill="#b4b0aa" font-family="Arial, sans-serif" font-size="24">Read the evidence. Connect the facts.</text>
  <text x="96" y="404" fill="#b4b0aa" font-family="Arial, sans-serif" font-size="24">Find the one person who could have done it.</text>
  <g transform="translate(96 474) rotate(-2)">
