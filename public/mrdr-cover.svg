<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">MRDR crime and deduction game cover</title>
  <defs>
    <pattern id="cover-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d6c9b5" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="cover-glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b52d25" stop-opacity=".19"/><stop offset="1" stop-color="#b52d25" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0d0d10"/>
  <rect width="1200" height="630" fill="url(#cover-grid)"/>
  <ellipse cx="1000" cy="300" rx="430" ry="330" fill="url(#cover-glow)"/>
  <path d="M56 54h1088v522H56z" fill="none" stroke="#b8aa93" stroke-opacity=".26"/>
  <g transform="translate(90 92)">
    <rect width="78" height="78" rx="7" fill="#17171c" stroke="#b52d25" stroke-width="2"/>
    <path d="M20 11h47v56H20z" fill="#212129" stroke="#a7a09a" stroke-opacity=".6"/>
    <g fill="#0d0d10" stroke="#a7a09a"><circle cx="20" cy="25" r="3"/><circle cx="20" cy="39" r="3"/><circle cx="20" cy="53" r="3"/></g>
