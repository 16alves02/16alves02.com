    <text x="110" y="32" text-anchor="middle" fill="#df7770" font-family="monospace" font-size="15" font-weight="900" letter-spacing="3">CASE FILE / 001</text>
  </g>
  <g transform="translate(590 105)">
    <rect width="510" height="390" fill="#15171d" stroke="#b8aa93" stroke-opacity=".42"/>
    <path d="M0 130h510M0 260h510M170 0v390M340 0v390" stroke="#b8aa93" stroke-opacity=".2"/>
    <g fill="none" stroke="#b8aa93" stroke-opacity=".55" stroke-width="2">
      <rect x="22" y="22" width="126" height="84"/><rect x="192" y="22" width="126" height="84"/><rect x="362" y="22" width="126" height="84"/>
      <rect x="22" y="152" width="126" height="84"/><rect x="192" y="152" width="126" height="84"/><rect x="362" y="152" width="126" height="84"/>
      <rect x="22" y="282" width="126" height="84"/><rect x="192" y="282" width="126" height="84"/><rect x="362" y="282" width="126" height="84"/>
    </g>
    <path d="M85 65 255 195 425 65 255 325 85 325" fill="none" stroke="#b52d25" stroke-width="3" stroke-dasharray="8 8"/>
    <g fill="#b52d25" stroke="#f0d9c7" stroke-width="2"><circle cx="85" cy="65" r="8"/><circle cx="255" cy="195" r="8"/><circle cx="425" cy="65" r="8"/><circle cx="255" cy="325" r="8"/></g>
    <g fill="#b8aa93" font-family="monospace" font-size="11" letter-spacing="2"><text x="28" y="45">ROOM 01</text><text x="198" y="45">ROOM 02</text><text x="368" y="45">ROOM 03</text><text x="28" y="175">ROOM 04</text><text x="198" y="175">ROOM 05</text><text x="368" y="175">ROOM 06</text></g>
  </g>
  <text x="1100" y="550" text-anchor="end" fill="#777a82" font-family="monospace" font-size="12" letter-spacing="3">AN ORIGINAL DEDUCTION GAME</text>
