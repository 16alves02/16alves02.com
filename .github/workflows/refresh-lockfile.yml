name: Refresh npm lockfile

on:
  push:
    branches:
      - chore/update-vite-6-4-6
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

concurrency:
  group: refresh-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate install and production build
        run: |
          npm ci
          npm run build
          npm run verify:theme
          npm run verify:production

      - name: Commit updated lockfile
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
