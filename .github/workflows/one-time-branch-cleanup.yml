name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all remote branches except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name' |
          while IFS= read -r branch; do
            if [[ "${branch}" == "main" ]]; then
              continue
            fi
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted branch: ${branch}"
          done

      - name: Remove this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/one-time-branch-cleanup.yml"
          file_sha="$(gh api "repos/${REPOSITORY}/contents/${workflow_path}" --jq '.sha')"
          gh api --method DELETE "repos/${REPOSITORY}/contents/${workflow_path}" \
            -f message="chore: remove one-time branch cleanup workflow" \
            -f sha="${file_sha}" \
            -f branch="main"
