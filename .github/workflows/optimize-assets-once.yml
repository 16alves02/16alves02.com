name: One-time portfolio image optimization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-assets-once.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Generate optimized responsive portrait and social preview
        shell: bash
        run: |
          npm install --no-save --package-lock=false sharp@0.34.5
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import sharp from 'sharp';

          const portraitPath = 'public/35A725EC-3FA5-4077-B167-C2185A787C71.png';
          const metadata = await sharp(portraitPath).metadata();
          if (!metadata.width || !metadata.height) throw new Error('Could not read portrait dimensions');

          for (const width of [480, 960]) {
            await sharp(portraitPath)
              .rotate()
              .resize({ width, withoutEnlargement: true })
              .webp({ quality: 78, effort: 5 })
              .toFile(`public/portrait-${width}.webp`);
          }

          await sharp('public/og-cover.svg', { density: 144 })
            .resize(1200, 630, { fit: 'fill' })
            .png({ compressionLevel: 9, adaptiveFiltering: true })
            .toFile('public/og-cover.png');

          const appPath = 'src/App.jsx';
          let app = fs.readFileSync(appPath, 'utf8');
          const oldPortrait = 'src="/35A725EC-3FA5-4077-B167-C2185A787C71.png" alt=';
          const newPortrait = `src="/portrait-960.webp" srcSet="/portrait-480.webp 480w, /portrait-960.webp 960w" sizes="(max-width: 720px) 100vw, 400px" width={${metadata.width}} height={${metadata.height}} alt=`;
          if (!app.includes(oldPortrait)) throw new Error('Expected hero portrait reference not found');
          app = app.replace(oldPortrait, newPortrait);
          app = app.replace('src="https://raw.githubusercontent.com/16alves02/SaborGest/main/web/assets/saborgest-logo.svg" alt="" loading=', 'src="https://raw.githubusercontent.com/16alves02/SaborGest/main/web/assets/saborgest-logo.svg" alt="" width="112" height="12" loading=');
          app = app.replace("project.name === 'RunLattice' && !dark ? '/runlattice-logo-light.svg' : project.image}\n          alt=", "project.name === 'RunLattice' && !dark ? '/runlattice-logo-light.svg' : project.image}\n          width={1024}\n          height={559}\n          alt=");
          fs.writeFileSync(appPath, app);

          const indexPath = 'index.html';
          let index = fs.readFileSync(indexPath, 'utf8');
          index = index.replaceAll('https://16alves02.pages.dev/og-cover.svg', 'https://16alves02.pages.dev/og-cover.png');
          index = index.replace('content="image/svg+xml"', 'content="image/png"');
          if (!index.includes('rel="preconnect" href="https://cloudflareinsights.com"')) {
            index = index.replace('    <meta name="color-scheme"', '    <link rel="preconnect" href="https://cloudflareinsights.com" crossorigin />\n    <meta name="color-scheme"');
          }
          fs.writeFileSync(indexPath, index);

          const cssPath = 'src/styles/global.css';
          let css = fs.readFileSync(cssPath, 'utf8').replaceAll('#EC5E27', '#C64B1B');
          fs.writeFileSync(cssPath, css);

          console.log(JSON.stringify({
            portraitOriginal: { width: metadata.width, height: metadata.height },
            portraitWebpBytes: {
              480: fs.statSync('public/portrait-480.webp').size,
              960: fs.statSync('public/portrait-960.webp').size
            },
            socialPngBytes: fs.statSync('public/og-cover.png').size
          }, null, 2));
          NODE

      - name: Commit optimized assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portrait-480.webp public/portrait-960.webp public/og-cover.png src/App.jsx src/styles/global.css index.html
          git commit -m "perf: optimize hero and social preview images"
          git push origin HEAD:main
