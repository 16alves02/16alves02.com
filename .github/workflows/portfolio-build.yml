name: Portfolio build

on:
  push:
    branches:
      - main
      - software-engineering-positioning-2027
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Verify theme contrast
        run: npm run verify:theme
