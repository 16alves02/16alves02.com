name: Regenerate CV PDFs

on:
  push:
    branches:
      - docs/recruiter-faq-and-readme-sync
    paths:
      - scripts/generate_cvs.py
      - .github/workflows/generate-cvs.yml

permissions:
  contents: write

concurrency:
  group: regenerate-cvs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install PDF generator
        run: python -m pip install reportlab

      - name: Regenerate Portuguese and English CVs
        run: python scripts/generate_cvs.py

      - name: Validate production build and assets
        run: |
          npm ci
          npm run build
          npm run verify:theme
          npm run verify:production

      - name: Commit generated PDFs
        shell: bash
        run: |
          git add public/cv-leonardo-alves-pt.pdf public/cv-leonardo-alves-en.pdf
          if git diff --cached --quiet; then
            echo "CV PDFs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate bilingual CV PDFs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
