name: Production Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Wait for the Cloudflare Pages production release
        shell: bash
        run: |
          base="https://16alves02.pages.dev"
          marker='name="portfolio-build" content="2026-11-12-static-prerender"'
          pages=( "/" "/projects/saborgest.html" "/projects/runlattice.html" "/projects/mrdr.html" "/projects/hoop.html" "/projects/raw.html" "/projects/basket-hub.html" "/projects/nova-imagem.html" )
          for attempt in {1..30}; do
            root="$(curl --location --fail --silent --show-error --max-time 20 --user-agent "PortfolioLighthouseCheck/1.0 (https://github.com/16alves02/16alves02.com)" "$base/" 2>/dev/null || true)"
            ready=true
            grep -Fq "$marker" <<< "$root" || ready=false
            for page in "${pages[@]:1}"; do
              html="$(curl --location --fail --silent --show-error --max-time 20 "$base$page" 2>/dev/null || true)"
              grep -Fq 'application/ld+json' <<< "$html" || ready=false
            done
            if [ "$ready" = true ]; then
              echo "Homepage and all seven case studies are live."
              exit 0
            fi
            echo "Waiting for the complete Cloudflare Pages release ($attempt/30)..."
            sleep 10
          done
          echo "The homepage or one or more case studies did not become available."
          exit 1

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Lighthouse
        run: npm install --global lighthouse@12.8.2

      - name: Run Lighthouse on homepage and case studies
        shell: bash
        run: |
          mkdir -p lighthouse-reports
          pages=( "homepage:/" "saborgest:/projects/saborgest.html" "runlattice:/projects/runlattice.html" "mrdr:/projects/mrdr.html" "hoop:/projects/hoop.html" "raw:/projects/raw.html" "basket-hub:/projects/basket-hub.html" "nova-imagem:/projects/nova-imagem.html" )
          for entry in "${pages[@]}"; do
            name="${entry%%:*}"
            path="${entry#*:}"
            echo "Auditing $name ($path)"
            lighthouse "https://16alves02.pages.dev$path" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="./lighthouse-reports/$name.json" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
          done

      - name: Print category scores
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            for (const file of fs.readdirSync("lighthouse-reports").sort()) {
              const report = JSON.parse(fs.readFileSync("lighthouse-reports/" + file, "utf8"));
              console.log("\\n" + file.replace(".json", "") + ":");
              for (const category of Object.values(report.categories)) {
                console.log("  " + category.title + ": " + Math.round(category.score * 100) + "/100");
              }
            }
          '

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: production-lighthouse-reports
          path: lighthouse-reports/*.json
          if-no-files-found: error
